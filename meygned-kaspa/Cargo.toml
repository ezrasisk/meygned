[package]
name = "meygned-kaspa"
version = "0.1.0"
edition = "2021"
description = "Kaspa RPC client, payload parser, and indexer for Meygned"

[dependencies]
meygned-core = { path = "../meygned-core" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"

# Storage
redb = "2"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Logging
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
