[package]
name = "meygned-kaspa"
version = "0.2.0"
edition = "2021"
description = "KNS resolution, payload scanning, signer verification, and publishing for Meygned"

[dependencies]
meygned-core = { path = "../meygned-core" }

# Kaspa wallet — from rusty-kaspa monorepo
kaspa-wallet-core  = "0.15.0"
kaspa-wallet-keys  = "0.15.0"
kaspa-wrpc-client  = "0.15.0"
kaspa-addresses    = "0.15.0"
kaspa-bip32        = "0.15.0"

# HTTP client (resolve + scanner)
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Hex decoding
hex = "0.4"

# Secure password prompt
rpassword = "7"

# Filesystem helpers (home dir)
dirs = "5"

# Error handling
thiserror = "1"

# Async
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"

[dev-dependencies]
tokio    = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
