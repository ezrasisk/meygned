[workspace]
resolver = "2"
members = [
    "meygned-core",
    "meygned-kaspa",
    "meygned-iroh",
    "meygned-cli",
]

# Shared dependency versions across the workspace
[workspace.dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "1"
tokio       = { version = "1", features = ["full"] }
tracing     = "0.1"

[profile.release]
opt-level   = 3
lto         = true
codegen-units = 1   # smaller binary, better for RPi deployment
strip       = true
